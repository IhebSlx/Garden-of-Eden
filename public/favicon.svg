<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Solarlux Agent Visualiser">
  <!--
    An orchestrator over two specialists, in the SPEC §6 kind colours: what the app
    draws, at icon size. Same geometry as scripts/make-icons.mjs, which renders the
    .ico and .png from these proportions — change both together.

    Deliberately NOT a redrawn Solarlux mark: the real wordmark is a corporate asset,
    used as supplied in the app's brand lockup and never traced by hand.
  -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#0d1330" />
      <stop offset="100%" stop-color="#05060f" />
    </radialGradient>
  </defs>

  <rect width="32" height="32" rx="7.04" fill="url(#bg)" />

  <g stroke="#38e1ff" stroke-width="1.34" stroke-linecap="round" opacity="0.5">
    <path d="M16 10.88 L8.64 22.72" />
    <path d="M16 10.88 L23.36 22.72" />
  </g>

  <circle cx="16" cy="10.88" r="4.8" fill="#8b5cf6" />
  <circle cx="8.64" cy="22.72" r="3.46" fill="#38e1ff" />
  <circle cx="23.36" cy="22.72" r="3.46" fill="#3ce8b0" />
</svg>
