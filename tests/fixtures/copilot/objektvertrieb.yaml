    displayName: Angebote-und-AB-SAP
    id: 840d3461-7b7e-40cf-9560-65ca7162c62c
    parentBotId: f3531522-25db-488e-a6e0-b0a944b7ceb3
    description: |-
      Searches SAP Angebote and Auftragsbestätigungen (Belege) in the Solarlux CRM. CONTAINS NO RECHNUNGEN — no Rechnung, no Abschlagsrechnung, no Schlussrechnung and no invoice amount is in here, and a Darchiv link never opens an invoice. For any question about Rechnungen or Rechnungsbeträge use Dokumente-Finden with Dokumententyp=Zahlungsprozess instead and do not call this tool. Use this tool only for: Angebots- and AN-Nummern, Angebotssummen, the value of a single SAP-Beleg, Beleg dates, the customer's own reference, and which Belege belong to a project. The Auftragswert here is the value of one SAP-Beleg — the project's overall Auftragswert comes from the Objektportal.

      Returns per Beleg: ax_sap_quotenumber (the document number, 10 digits with leading zeros — 0020191333 is AN 20191333), ax_name, ax_customer_quote_number (often the Bauvorhaben name the customer used), ax_sap_total_amount, ax_quote_date, ax_quote_document_type, ax_mysolarluxlink (a direct link to the document in Darchiv), and _ax_opportunityid_value (the Verkaufschance it belongs to).

      All parameters are optional:

      ANNummer: the document number as the user says it, e.g. 20191333. Leading zeros are added automatically.

      VcGuid: the opportunityid of a Verkaufschance, to list all its Belege. Take this from a Projekte-Suchen CRM result.

      Suchtext: free text searched in the Beleg name and the customer reference.

      JahrVon / JahrBis: four-digit years, filtering on the Beleg date.

      MinWert / MaxWert: amount limits in euros, digits only.

      SortierFeld: ax_sap_total_amount or ax_quote_date.

      Richtung: desc or asc.

      Anzahl: maximum rows, default 25.

      NurZaehlen: set to ja to receive only the number of matching Belege.

      To answer "was haben wir für Projekt X angeboten oder verkauft": first find the project with Projekte-Suchen CRM, then call this tool with VcGuid for each VC of the family — a project's Belege hang on individual VCs, not on the family as a whole.

      The Darchiv link may not open for every user depending on their permissions; offer it as a convenience, never as the answer itself. It opens an Angebot or an Auftragsbestätigung — never a Rechnung.
