      shortDescription: Assistent für Bauprojekte im Objektvertrieb – Status, VCs, Belege, Dokumente.
      longDescription: |-
        Der Objektvertrieb-Assistent beantwortet Fragen zu Bauprojekten aus den angebundenen Solarlux-Systemen: Verkaufschancen und Projektfamilien (CRM), Projektstatus, Rollen, Auftragswert und Systeme (Objektportal), SAP-Angebote und Auftragsbestätigungen sowie Projektdokumente inkl. Rechnungen (Bauprojekt-Sites).

        Beispiele: „Stand von Köln, Tempelstr.", „Welche VCs gehören zu diesem Projekt?", „Gib mir die Rechnungen zum größten Berliner Projekt", „Alles zu Hamburg, Marckmannstraße".

        Alle Antworten stammen ausschließlich aus den verbundenen Systemen. Nur für den internen Gebrauch im Solarlux Objektvertrieb.
