    description: |-
      Liefert das komplette Bild EINES benannten Bauprojekts in einem einzigen Aufruf: Portal-Daten (Status, Rollen, Auftragswert netto, Systeme, Termine, Website-Link), die gesamte VC-Familie mit Status und Auftraggebern (löst leere VcId selbst über die Adresse auf), alle SAP-Belege der Familie und die Dokumente der Bauprojekt-Site mit Links. Input: der kürzeste markante Adress- oder Namensteil, z. B. "Hertha-Sponer" oder "Franklinstr" — keine Hausnummern. Verwenden für "alles zu X", "alle Infos", "was wissen wir über X", "Stand von X", "Übersicht/Zusammenfassung zu X" und jede Frage, die mehrere Aspekte eines Projekts gleichzeitig betrifft. Liefert kandidaten > 1, wenn mehrere Projekte passen — dann portalKandidaten auflisten und nachfragen. NICHT verwenden für Einzelwerte (Status, Auftragswert, Rollen — direkt Portal-Suche), für Zähl-, Ranking- oder Personenfragen (Portal-Suche mit NurZaehlen/SortierFeld/Person), für Beleg-Suchen per AN-Nummer (Angebote-und-AB-SAP), für Rechnungs-/Dokumenttyp-Fragen (Dokumente-Finden) oder für Dokumentinhalte (Dokument-Lesen).
      Enthält keine CRM-Aktivitäten/E-Mails — für Kommunikationsverlauf zusätzlich VC-Aktivitaeten aufrufen.
