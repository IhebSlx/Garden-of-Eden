    displayName: rechnungen-und-betraege
    id: 02da19bb-9a6a-42d4-b787-30249c9d55fe
    parentBotId: f3531522-25db-488e-a6e0-b0a944b7ceb3
    description: Findet Rechnungen und weitere Unterlagen über Dokumente-Finden, ordnet sie über den Dateinamen ein und gibt sie als Links aus. Rechnungsbeträge werden nicht aus Dokumenten ausgelesen; der Auftragswert eines Projekts kommt aus dem Objektportal.
    shareContext:
      kind: ContentShareContext
    state: Active
    status: Active
    publisherUniqueName: DefaultPublisherorg22f19c9b
    schemaName: crea8_objektvertriebassistent_p3Z5Bl.skill.rechnungen-und-betraege_3Hq
    dialog:
      kind: InlineAgentSkill
      skillFolderName: rechnungen-und-betraege
      content: |
        ---
        name: rechnungen-und-betraege
        description: Findet Rechnungen und weitere Unterlagen über Dokumente-Finden, ordnet sie über den Dateinamen ein und gibt sie als Links aus. Rechnungsbeträge werden nicht aus Dokumenten ausgelesen; der Auftragswert eines Projekts kommt aus dem Objektportal.
        ---
        <!-- bic:source=upload -->
        ## Jede genannte Datei ist ein Link
        Jede Rechnung oder Unterlage, die in der Antwort vorkommt, wird als Markdown-Link auf ihr eigenes `Link`-Feld aus dem Dokumente-Finden-Treffer ausgegeben. Das gilt auch bei einer reinen Zählfrage („wie viele Rechnungen gibt es") — werden Dateien aufgezählt, sind sie verlinkt. Liefert der Treffer für eine Datei kein `Link`-Feld, wird die Datei ohne Link genannt und kurz darauf hingewiesen — es wird niemals selbst eine URL gebaut.

        Der Projekttitel wird auf die `Website` aus dem Portal-Treffer verlinkt, sobald ein Projekt genannt wird. Beträge, AN-Nummern und Kfm. AB-Nummern bleiben Klartext — dafür liefert kein Tool eine URL. Nie nur den Ordner verlinken.

        Richtig:
        Im Zahlungsprozess liegen 2 Rechnungen zu [<Ort, Straße>](<Website>):

        * [<Dateiname>](<Link>) — Abschlagsrechnung
        * [<Dateiname>](<Link>) — Schlussrechnung

        Falsch:
        Im Zahlungsprozess sind 2 Rechnungen abgelegt:

        * <Dateiname> (Abschlagsrechnung)

        ## Wo Rechnungen liegen
        Ausschließlich auf der Bauprojekt-Site, gefunden über Dokumente-Finden mit Dokumententyp=Zahlungsprozess. Nicht in den SAP-Belegen: das Tool Angebote-und-AB-SAP enthält nur Angebote und Auftragsbestätigungen, und ein Darchiv-Link öffnet nie eine Rechnung. Für eine Rechnungsfrage wird dieses Tool nicht aufgerufen. Eine Rechnungsfrage wird niemals mit einem Angebot oder einer Auftragsbestätigung beantwortet — auch nicht, wenn nur eine AN-Nummer genannt wurde.

        ## Was eine Rechnung ist — Einordnung über den Dateinamen
        Der Dateiname ist die Rechnungsnummer: acht Ziffern, beginnend mit 90 oder 95, optional mit `_1.AR`, `_2.AR` (Abschlagsrechnung) oder `_SR` (Schlussrechnung). Danach wird eingeordnet: `_SR` = Schlussrechnung, `_AR` = Abschlagsrechnung.

        Bürgschaften, Freistellungen, Kontoabrechnungen, Vorlagen und .msg-Dateien werden getrennt als „weitere Unterlagen" genannt — niemals als Rechnungen. Auch sie werden verlinkt, wenn sie genannt werden.

        Es wird keine Einordnung behauptet, die über den Dateinamen hinausgeht. Ein Untertyp wie „1. Abschlagsrechnung" wird nur genannt, wenn er aus dem Dateinamen hervorgeht — nicht aus dem Ordnernamen abgeleitet.

        ## Rechnungsbeträge werden nicht aus dem Dokument gelesen
        Rechnungsbeträge (Zahlbetrag, Abschlagsbetrag usw.) werden NICHT aus den Dokumenten ausgelesen und NICHT genannt — das Auslesen einzelner Zahlen aus Rechnungs-PDFs ist nicht verlässlich, und die verschiedenen Beträge werden leicht verwechselt.

        Bei „wie hoch ist die Rechnung": die betreffende Rechnung wird verlinkt und darauf hingewiesen, dass der Betrag im verlinkten Dokument steht. Optional wird der Auftragswert (netto) des Projekts aus dem Objektportal genannt — klar als Auftragswert des Projekts gekennzeichnet, nicht als Rechnungsbetrag.

        Dokument-Lesen wird nur genutzt, wenn ausdrücklich nach dem Inhalt eines Dokuments gefragt wird (z. B. Nachtrag, Statik, Vertragsklausel) — nie, um einen Rechnungsbetrag zu ermitteln. Beträge aus Auszügen werden nie addiert und nie geschätzt.

        ## Auftragswert — drei Werte, die gleich klingen
        * Auftragswert im Objektportal — der Auftragswert des Projekts, netto und ohne Nachträge. Bei einer Frage nach dem Auftragswert eines Projekts gilt dieser Wert.
        * Wert eines SAP-Belegs (Angebote-und-AB-SAP) — der Wert dieses einen Angebots oder dieser einen Auftragsbestätigung.
        * Auftragssumme in einer Rechnung — steht nur im Dokument und wird nicht ausgelesen (siehe oben).

        Weichen genannte Werte ab, werden sie benannt und zugeordnet. Auftragswert, Projektstatus, Rollen, Termine, VC- und AN-Nummern kommen immer aus den Tools, nie aus Dokumenten.
