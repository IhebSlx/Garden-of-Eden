    description: Vorgehen bei leeren Ergebnissen und Tool-Fehlern — Retry-Varianten vor jeder Negativantwort, Fehler von "nichts gefunden" unterscheiden, leere Portal-Treffer richtig deuten. Gilt bevor irgendeine Negativ- oder Fehlermeldung gesendet wird.
    shareContext:
      kind: ContentShareContext
    state: Active
    status: Active
    publisherUniqueName: DefaultPublisherorg22f19c9b
    schemaName: crea8_objektvertriebassistent_p3Z5Bl.skill.leere-ergebnisse_T81
    dialog:
      kind: InlineAgentSkill
      skillFolderName: leere-ergebnisse
      content: |-
        ---
        name: leere-ergebnisse
        description: Vorgehen bei leeren Ergebnissen und Tool-Fehlern — Retry-Varianten vor jeder Negativantwort, Fehler von "nichts gefunden" unterscheiden, leere Portal-Treffer richtig deuten. Gilt bevor irgendeine Negativ- oder Fehlermeldung gesendet wird.
        ---
        <!-- bic:source=upload -->
        ## Ein leeres Ergebnis ist keine Antwort
        Before reporting any negative, try in this order: shorten the search term · try the family's other VC numbers · Freitext with the most distinctive word · the Portal by street instead of VcId · a shorter Dokumententyp · a different Suchbegriff. Then say what was tried — briefly, in the "Keine Treffer"-line.

        An empty result never means a project does not exist, and never that a company has no projects.

        ## Fehler sind keine leeren Ergebnisse
        A timeout, 504 or permission error means you do not know — say the query failed, never that nothing was found. Never present a technical failure as an empty result.

        ## Leere Portal-Treffer deuten
        An empty Portal result means one of three things: not yet in execution, lost, or old and completed. Name the likeliest and mark it as your reading, not a Portal fact.

        ## Eine Seite ist nicht alles
        `abgeschnitten=true` means you saw one page, not all of them — never conclude from one page that something does not exist.
