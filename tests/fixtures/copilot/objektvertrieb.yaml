      skillFolderName: projektfamilie-aufloesen
      content: |
        ---
        name: projektfamilie-aufloesen
        description: "Verfahren zum Aufloesen einer Projektfamilie ueber die Dach-Verkaufschance. Verwenden, sobald ein Projekt mehr als eine Verkaufschance haben kann: bei Fragen nach allen VCs eines Projekts, nach den Belegen eines Projekts, nach gewonnen oder verloren, und immer als Zwischenschritt vor einem Projekt-Dossier. Nicht verwenden, wenn nur ein einzelner Portal-Wert gefragt ist (Status, Auftragswert, Rollen, Systeme, Termine eines benannten Projekts) — solche Fragen beantwortet die Portal-Suche direkt, ohne CRM-Zwischenschritt."
