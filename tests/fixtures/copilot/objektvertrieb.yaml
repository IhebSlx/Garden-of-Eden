    parentBotId: f3531522-25db-488e-a6e0-b0a944b7ceb3
    description: Regeln für jede Anzahl-, Summen- oder Ranking-Frage — Zählen nur über NurZaehlen, gekappt/abgeschnitten korrekt behandeln, Rankings von der Quelle sortieren lassen, gezählte Treffer verlinken.
    shareContext:
      kind: ContentShareContext
    state: Active
    status: Active
    publisherUniqueName: DefaultPublisherorg22f19c9b
    schemaName: crea8_objektvertriebassistent_p3Z5Bl.skill.zahlen-und-zaehlen_Ewi
    dialog:
      kind: InlineAgentSkill
      skillFolderName: zahlen-und-zaehlen
      content: |-
        ---
        name: zahlen-und-zaehlen
        description: Regeln für jede Anzahl-, Summen- oder Ranking-Frage — Zählen nur über NurZaehlen, gekappt/abgeschnitten korrekt behandeln, Rankings von der Quelle sortieren lassen, gezählte Treffer verlinken.
        ---
        <!-- bic:source=upload -->
        ## Zählen — nur über NurZaehlen
        Counts come only from a tool's NurZaehlen mode. "insgesamt", "über 30", "etwa", "die meisten" all require that call first. Never count retrieved rows; with examples but no count, write "Beispiele" and give no total.

        Name what a count counted — which fields, which filters. A bare number without its basis is not an answer. A Portal count counts portal entries, not Bauprojekte, and only projects in execution — always name the phases counted. "aktuell/gerade/laufend" restricts the query itself to active phases (NurAktiv).

        ## gekappt und abgeschnitten
        `gekappt:true` = the ceiling was hit: report "mindestens <Zahl>" and say the exact number is not retrievable. This applies to CRM counts; a Portal count with NurZaehlen is exact and complete.

        `abgeschnitten=true` means you saw one page, not all. Sum only when `abgeschnitten=false`, then say how many entries the sum covers. Never sum amounts from document excerpts — a fragment cannot be known to be complete. Never estimate.

        ## Rankings
        For rankings ("größte Projekte", "neueste Projekte") set SortierFeld, Richtung and Anzahl so the source does the sorting — never rank retrieved rows yourself. For top-N, set Anzahl to N.

        ## Identifikatoren und Links
        Reproduce identifiers exactly, leading zeros included. List all of a project's VC and AN numbers. Kfm. AB-Nummern come padded and unpadded — try both forms.

        A count answer that names the counted items links each of them — the LINKS rule applies to counts exactly as to any other answer.
