    description: Übersetzt Produktfamilien-Begriffe (Holzsysteme, Glas-Faltwände, cero, Balkonverglasung …) in die konkreten Systemnamen für den Systeme-Parameter der Portal-Suche. Gilt für jede Frage nach Projekten mit einer Produktfamilie oder einem Systemtyp.
    shareContext:
      kind: ContentShareContext
    state: Active
    status: Active
    publisherUniqueName: DefaultPublisherorg22f19c9b
    schemaName: crea8_objektvertriebassistent_p3Z5Bl.skill.produktfamilien_lD8
    dialog:
      kind: InlineAgentSkill
      skillFolderName: produktfamilien
      content: |-
        ---
        name: produktfamilien
        description: Übersetzt Produktfamilien-Begriffe (Holzsysteme, Glas-Faltwände, cero, Balkonverglasung …) in die konkreten Systemnamen für den Systeme-Parameter der Portal-Suche. Gilt für jede Frage nach Projekten mit einer Produktfamilie oder einem Systemtyp.
        ---
        <!-- bic:source=upload -->
        ## Familie zu Systemen auflösen
        Expand a family to its systems and pass them comma-separated to the `Systeme` parameter of Portal-Suche. Matching is case-insensitive and matches inside multi-value entries — short stems find all variants (cero findet auch CERO IIIa, Combiline auch "Combiline FW").

        * Holzsysteme: Woodline, Combiline, SL 97
        * Glas-Faltwände: Ecoline, Highline, Megaline, Woodline, Combiline, SL 25, SL25, SL 25R, SL 25XXL, SL25XXL, SL 35, SL 45, SL 97
        * Schiebefenster / cero: cero
        * Hebe-Schiebe / Schiebetüren: SL 178, SL178, SL 179, SL179, Ecoline S, Highline S
        * Balkonverglasung: Proline T, Proline S, Proline S Mega
        * Horizontal-Schiebe-Wände: SL 60-HSW, SL 60 HSW
        * Trennwände: Ecoline Flexa, SL 45 Flexa, SL 60-HSW Flexa

        ## Schreibweisen im Portal
        Das Systeme-Feld ist Freitext mit uneinheitlichen Schreibweisen (SL 25 und SL25, SL178 ohne Leerzeichen, SL 60 HSW ohne Bindestrich). Liefert ein Stem nichts, obwohl Treffer plausibel wären, wird einmal mit der Variante ohne/mit Leerzeichen bzw. Bindestrich nachgesucht, bevor ein Negativ gemeldet wird.

        ## Unbekannte Begriffe
        If a term is not listed, say you do not know which systems belong to it and ask. Never guess a family — an incomplete list produces a confident wrong answer nobody catches. Systeme, die im Portal vorkommen, aber keiner Familie hier zugeordnet sind (z. B. SL 125, SL 310, SL 320, SL 925, SL 926, SL 960), werden nur auf direkte Nachfrage nach genau diesem System gesucht — nie stillschweigend einer Familie zugerechnet.

        ## Ausgabe
        A system designation returned by a tool is reported exactly as the tool wrote it, even when it does not appear in this list — the list serves searching, not validating.
