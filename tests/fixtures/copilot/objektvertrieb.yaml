    description: Verfahren fuer Fragen zu Kommunikation und Verlauf einer Verkaufschance — letzter Kontakt, E-Mails, Besprechungen, Telefonate, Aufgaben, was wurde besprochen, angefordert oder vereinbart. Legt fest, dass erst die Zeitleiste bzw. die Inhaltssuche (VC-Aktivitaeten, ggf. mit Suchwort) geholt und dann gezielt einzelne Aktivitaeten (Aktivitaet-Lesen) gelesen werden.
    shareContext:
      kind: ContentShareContext
    state: Active
    status: Active
    publisherUniqueName: DefaultPublisherorg22f19c9b
    schemaName: crea8_objektvertriebassistent_p3Z5Bl.skill.aktivitaeten-und-kontakte_Sal
    dialog:
      kind: InlineAgentSkill
      skillFolderName: aktivitaeten-und-kontakte
      content: |
        ---
        name: aktivitaeten-und-kontakte
        description: Verfahren fuer Fragen zu Kommunikation und Verlauf einer Verkaufschance — letzter Kontakt, E-Mails, Besprechungen, Telefonate, Aufgaben, was wurde besprochen, angefordert oder vereinbart. Legt fest, dass erst die Zeitleiste bzw. die Inhaltssuche (VC-Aktivitaeten, ggf. mit Suchwort) geholt und dann gezielt einzelne Aktivitaeten (Aktivitaet-Lesen) gelesen werden.
        ---
        <!-- bic:source=upload -->
        ## Erst finden, dann lesen
        Für Verlaufs- und Kommunikationsfragen gilt eine feste Reihenfolge:

        1. **VC-Aktivitaeten** mit der VC-Nummer (oder VcGuid) aufrufen → liefert die Zeitleiste: Typ (email, appointment, phonecall, task), Betreff, Datum, ActivityId. Optional per `Typ` filtern, wenn nur E-Mails oder nur Termine gefragt sind.
        2. Bei **inhaltlichen Fragen** ("wurde die Statik angefordert?", "was wurde zur Verglasung vereinbart?", "hat der Kunde reagiert?", "wurde X erwähnt?") wird VC-Aktivitaeten mit einem `Suchwort` aufgerufen — dem markantesten Einzelwort der Frage (Statik, Verglasung, Nachtrag, Aufmaß, ein Nachname oder Firmenname). Nicht mit ganzen Sätzen suchen. Das durchsucht Betreff UND Inhalt der E-Mails der VC. Liefert das Suchwort nichts, einmal mit einem Synonym oder verwandten Begriff wiederholen, dann die normale Zeitleiste prüfen, bevor ein Negativ gemeldet wird.
        3. Nur wenn der **vollständige Inhalt** einer Aktivität gebraucht wird: **Aktivitaet-Lesen** mit der ActivityId der relevanten Aktivität → liefert den Text (description) und die Beteiligten (Von/An aus den activityparties).

        Niemals alle Inhalte auf Vorrat lesen — erst finden bzw. per Suchwort eingrenzen, dann gezielt lesen. Für "letzter Kontakt" genügt Schritt 1: die neueste Aktivität mit Typ, Betreff und Datum nennen.

        ## Projekt statt VC
        Ist nur ein Projekt (Adresse/Name/Ort+System) genannt, zuerst die VC-Nummer ermitteln (Projektfamilie auflösen bzw. das Dossier-Ergebnis nutzen; bei Portal-Treffern die VcId, bei leerer VcId der Adress-Fallback). Bei einer Familie mit mehreren VCs die Aktivitäten der Dach-VC zuerst prüfen; bei Bedarf weitere Mitglieder. Passen mehrere Projekte auf die Angabe, erst auflisten und nachfragen — nie stillschweigend eines wählen.

        ## Berichten
        - Zeitleisten kompakt: Datum · Typ · Betreff, neueste zuerst. Keine ActivityIds in der Antwort — die sind nur zum Nachschlagen.
        - Inhalte mit Herkunft zitieren: "laut E-Mail vom <Datum> (<Betreff>)". Der Text (description) kann HTML-Reste und zitierte Vorgänger-Mails enthalten — die relevante Kernaussage zusammenfassen statt alles wiederzugeben.
        - Beteiligte aus den activityparties benennen (Von/An), soweit vorhanden.
        - Sichtbar ist nur, was im CRM als Aktivität erfasst wurde. Nicht erfasste Kommunikation existiert möglicherweise trotzdem — nie behaupten, es habe "keinen Kontakt" gegeben; stattdessen: "keine erfasste Aktivität". Abgelegte .msg-Dateien auf der Bauprojekt-Site sind zusätzlich über Dokumente-Finden auffindbar.
        - Beträge, Termine oder Zusagen aus E-Mail-Texten sind Aussagen der Korrespondenz, keine Systemdaten — als solche kennzeichnen. Strukturierte Fakten (Auftragswert, Status, AN-Nummern) kommen weiterhin aus den Tools.
