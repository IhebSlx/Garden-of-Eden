        <!-- bic:source=upload -->
        # Projektfamilie auflösen

        ## Anweisungen

        Ein Bauprojekt hat in der Regel mehrere Verkaufschancen, weil jede Stufe der Lieferkette getrennt anfragt. Die VCs hängen an einer Dach-Verkaufschance, die oft später entstanden ist als ihre Mitglieder. Jedes Mitglied führt zum ganzen Projekt.

        ### Einstieg — feste Reihenfolge

        1. Liefert der Portal-Treffer eine **VcId** → Projekte-Suchen CRM mit `VcNummer` laden, dann die Familie auflösen (siehe unten).
        2. Ist die VcId **leer oder fehlt: nicht aufgeben** — Projekte-Suchen CRM mit `Strasse` + `Ort` suchen, den Treffer über `sl_street1` (Hausnummer) abgleichen, dann die Familie auflösen.
        3. Bleibt das leer: `Freitext` mit dem markantesten Wort des Projektnamens.

        Erst wenn alle drei Wege leer sind, wird gesagt, dass keine VC ermittelt wurde — mit Angabe, was versucht wurde. Solange eine Adresse, ein Projektname oder eine Kfm. AB-Nummer vorliegt, ist „keine VC ermittelbar" eine falsche Antwort.

        ### Auflösen

        Im gefundenen VC das Feld `_sl_primary_opportunityid_value` lesen.

        * Ist es gesetzt, ist diese GUID die Dach-VC: erneut mit `FamilieGuid` aufrufen, um alle Mitglieder zu erhalten.
        * Ist das Feld null **oder im Ergebnis gar nicht vorhanden**, wird beides gleich behandelt: der VC ist möglicherweise selbst die Dach-VC — mit `FamilieGuid` = eigene `opportunityid` aufrufen.

        ### Deuten

        Ein als „verloren" markiertes Mitglied neben einem neueren „gewonnen" bedeutet, dass der Abschluss über eine andere Stufe der Lieferkette lief — **nicht**, dass das Projekt verloren ist.

        Die Gesamtlage des Projekts wird zuerst berichtet, danach die einzelnen VCs.

        VC-Nummern werden exakt wiedergegeben, führende Nullen eingeschlossen, und vollständig aufgeführt.

        ### Konsequenz für die SAP-Belege

        Belege hängen an einzelnen VCs, nie an der Familie. Für „was haben wir angeboten oder verkauft" wird **Angebote-und-AB-SAP** mit `VcGuid` für **jeden** VC der Familie aufgerufen — ein einzelner Aufruf beantwortet die Frage nicht.

        Das liefert Angebote und Auftragsbestätigungen. Rechnungen sind dort nicht enthalten; sie kommen über Dokumente-Finden (Dokumententyp=Zahlungsprozess).

        ### Reichweite

        Suchen über `VcNummer` und `FamilieGuid` gehen bewusst über alle Vertriebswege, weil Familienmitglieder außerhalb des Objektvertriebs liegen können. Wird ein Mitglied außerhalb gefunden, wird es genannt und als solches gekennzeichnet.
