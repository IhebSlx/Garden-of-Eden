    id: aa19dde9-1ee6-4a39-981c-5ab76f8985a3
    parentBotId: f3531522-25db-488e-a6e0-b0a944b7ceb3
    description: Source of truth for whether a Bauprojekt exists at all and which Verkaufschancen (VCs) belong to it. Contains every VC of all time — open, won, lost — Objektvertrieb only (Fachhandel and Privatkunden are excluded inside the tool). Returns the VC numbers, project name, city/street, and the Auftraggeber, Architekturbüro and Endkunde, plus the umbrella-VC pointer for resolving a project family. The project name (sl_project_name) often carries the system designation. Use for "does this project exist", "which VCs", company/architect/Bauherr lookups, and to resolve a VC family. Does NOT have Projektstatus, roles, Auftragswert, Systeme or dates — get those from Portal-Suche Objektportal. Do not call this tool as a preparatory step when the question only asks for a single Portal value (Status, Auftragswert, Rollen, Systeme, Termine) of a named project — Portal-Suche answers those directly.
    shareContext:
      kind: ContentShareContext
    state: Active
    status: Active
    publisherUniqueName: DefaultPublisherorg22f19c9b
    schemaName: crea8_objektvertriebassistent_p3Z5Bl.tool.Projekte-SuchenCRM_6FI
    dialog:
      kind: WorkflowTool
      workflowId: 5f508191-ae3e-9cdd-5553-19dc1a73ea31
      toolInputs:
        - kind: AgentToolInput
          name: text
          displayName: VcNummer
          description: Exact VC number, e.g. 2024035281. When set, everything else is ignored and no channel restriction applies.
        - kind: AgentToolInput
          name: text_1
          displayName: FamilieGuid
          description: GUID of an umbrella VC, to list all VCs of one project family. When set, no channel restriction applies.
        - kind: AgentToolInput
          name: text_2
          displayName: Ort
          description: 'City, street or project name. Use the most specific term the user gave: for "Kaulbachstr. 26 in Berlin" search Kaulbachstr, not Berlin. Never include house numbers or postcodes. A city alone returns only the newest projects of that city and will miss older ones.'
        - kind: AgentToolInput
          name: text_3
          displayName: Status
          description: "One of: gewonnen, offen, verloren. Leave empty for all."
        - kind: AgentToolInput
          name: text_4
          displayName: JahrVon
          description: Four-digit year, filters on the creation date of the VC.
        - kind: AgentToolInput
          name: text_5
          displayName: JahrBis
          description: Four-digit year, filters on the creation date of the VC.
        - kind: AgentToolInput
          name: text_6
          displayName: Vertriebsweg
          description: Leave this parameter completely empty. Do not pass channel codes or numbers. Only if the user explicitly asks about Fachhandel, Privatkunden or all sales channels, set the single word alle or fachhandel.
        - kind: AgentToolInput
          name: text_7
          displayName: SortierFeld
          description: "One of: createdon, ax_opportunity_number, name. Defaults to createdon."
        - kind: AgentToolInput
          name: text_8
          displayName: Richtung
          description: desc or asc. Defaults to desc.
        - kind: AgentToolInput
          name: text_9
          displayName: Anzahl
          description: Maximum rows, e.g. 10. Defaults to 25.
        - kind: AgentToolInput
          name: text_10
          displayName: NurZaehlen
          description: Set to ja to return only the number of matching VCs instead of the rows. Use for every "wie viele" question.
        - kind: AgentToolInput
          name: text_11
          displayName: Strasse
          description: Street name only, without house number, e.g. Reichsbahnstr or Lindenstr. Fill this whenever the user mentions a street. Combine it with Ort when a city is also given.
        - kind: AgentToolInput
          name: text_12
          displayName: Firma
          description: Company name or part of it, e.g. Goldbeck, Zech, baucenter. Searches the Auftraggeber, the Architekturbüro and the Endkunden together. Use this whenever a company is named and you do not know its role.
        - kind: AgentToolInput
          name: text_13
          displayName: Architekt
          description: Name of an Architekturbüro or part of it. Use only when the user explicitly asks about the architect.
        - kind: AgentToolInput
          name: text_14
          displayName: Endkunde
          description: Name of an Endkunde or Bauherr, or part of it. Use only when the user explicitly asks about the Endkunde or Bauherr.
        - kind: AgentToolInput
          name: text_15
          displayName: Freitext
          description: 'Free search across all text fields at once: project name, street, city, project title, Auftraggeber, Architekturbüro and Endkunde. Use this as a fallback when the targeted parameters returned nothing, or when the user names a distinctive term whose role is unclear — a Bauvorhaben name, a company, a project title. Pass one distinctive word, not a whole phrase: a proper noun or a street stem, never generic words like "Sanierung", "Neubau" or "Projekt".'
      toolOutputs:
        - kind: AgentToolOutput
          name: text
      connectionProperties:
        kind: ConnectionProperties
        diagnostics: null
        mode: Invoker
