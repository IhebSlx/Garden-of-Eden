    description: "For Status, Rollen, Auftragswert, Systeme or Termine of a named project, call this tool FIRST, directly with the street as Ort — no prior CRM lookup needed. The only source for Projektstatus, roles (Projektleiter, ADM, VIDO, MoKo, Aufmaß-/Objekt-Techniker, Auftragsmanager, Einkauf), Auftragswert, Systeme, Mengen, and project dates, plus the Bauprojekt Website link and Kfm. AB-Nummer. Covers the ~321 projects that reached execution: Ausführung, Abnahme, Gewährleistung, Gestoppt (Gestoppt is present but not active). Its Auftragswert is netto and excludes Nachträge, so a document may show more. Use for status/roles/value/systems/dates and for counts (NurZaehlen) and rankings. Contains nothing before execution, nothing lost, nothing old-and-completed — an empty result never means a project does not exist."
    shareContext:
      kind: ContentShareContext
    state: Active
    status: Active
    publisherUniqueName: DefaultPublisherorg22f19c9b
    schemaName: crea8_objektvertriebassistent_p3Z5Bl.tool.Portal-SucheObjektportal1_Tdt
    dialog:
      kind: WorkflowTool
      workflowId: 960a0cac-8c5f-6f20-59b0-d928e040c93e
      toolInputs:
        - kind: AgentToolInput
          name: text
          displayName: Ort
          description: City name, for example Hamburg. Leave empty if the question is not about a specific city.
        - kind: AgentToolInput
          name: text_1
          displayName: Status
          description: "Exactly one of: Ausführung, Abnahme, Gewährleistung, Gestoppt. Leave empty for all phases."
        - kind: AgentToolInput
          name: text_2
          displayName: Person
          description: Last name or full name of a Projektleiter or ADM, for example Hune. Leave empty if the question is not about a person.
        - kind: AgentToolInput
          name: text_3
          displayName: JahrVon
          description: Start year as four digits, for example 2026. Filters on Startdatum from 1 January of that year. Leave empty for no lower limit.
        - kind: AgentToolInput
          name: text_4
          displayName: "JahrBis "
          description: End year as four digits, for example 2026. Filters on Startdatum until 31 December of that year. Leave empty for no upper limit.
        - kind: AgentToolInput
          name: text_5
          displayName: SortierFeld
          description: "Exactly one of: desc, asc. Use desc for largest or newest first. Leave empty to default to desc."
        - kind: AgentToolInput
          name: text_6
          displayName: Richtung
          description: "Exactly one of: desc, asc. Use desc for largest or newest first. Leave empty to default to desc."
        - kind: AgentToolInput
          name: text_7
          displayName: Anzahl
          description: Maximum number of rows to return as a number, for example 3 for a top-3 question. Leave empty to default to 50.
        - kind: AgentToolInput
          name: text_8
          displayName: Person2
          description: Second person's surname, when the question asks for a project involving two people. Leave empty otherwise.
        - kind: AgentToolInput
          name: text_9
          displayName: Systeme
          description: Product or system name, e.g. Cero, Highline, SL 25. Leave empty if the question is not about a product.
        - kind: AgentToolInput
          name: text_10
          displayName: VcId
          description: Exact VC number to find the portal entry of a known Verkaufschance. Leave empty otherwise.
        - kind: AgentToolInput
          name: text_11
          displayName: NurAktiv
          description: Set to ja for all currently active projects (Ausführung, Abnahme, Gewährleistung together). Leave empty otherwise. Do not combine with Status.
        - kind: AgentToolInput
          name: text_12
          displayName: MinWert
          description: Minimum Auftragswert in euros, digits only, e.g. 500000. Leave empty for no lower limit.
        - kind: AgentToolInput
          name: text_13
          displayName: MaxWert
          description: Maximum Auftragswert in euros, digits only. Leave empty for no upper limit.
        - kind: AgentToolInput
          name: text_14
          displayName: DatumsFeld
          description: "Which date the JahrVon/JahrBis range applies to: Startdatum, Enddatum or Vertragsdatum. Defaults to Startdatum. Use Enddatum for questions about when projects finish."
        - kind: AgentToolInput
          name: text_15
          displayName: KfmABNummer
          description: Exact Kfm. AB-Nummer, e.g. 188447. Leave empty otherwise.
        - kind: AgentToolInput
          name: text_16
          displayName: NurZaehlen
          description: Set to ja to return only the number of matching projects instead of the rows. Use for "wie viele" questions.
      toolOutputs:
        - kind: AgentToolOutput
          name: text
      connectionProperties:
        kind: ConnectionProperties
        diagnostics: null
        mode: Invoker
