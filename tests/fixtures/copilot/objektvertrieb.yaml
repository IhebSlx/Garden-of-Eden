    parentBotId: f3531522-25db-488e-a6e0-b0a944b7ceb3
    description: Verfahren fuer das Gesamtbild eines Bauprojekts. Verwenden bei Formulierungen wie alles, alle Infos, was wissen wir ueber, Stand von, Uebersicht, Zusammenfassung sowie bei jeder Frage, die mehrere Aspekte eines Projekts gleichzeitig betrifft. Legt fest, dass dafuer das Tool Projekt-Dossier mit einem einzigen Aufruf genutzt wird und wie das Ergebnis statusabhaengig berichtet wird. Nicht verwenden, wenn nur ein einzelner Wert gefragt ist.
    shareContext:
      kind: ContentShareContext
    state: Active
    status: Active
    publisherUniqueName: DefaultPublisherorg22f19c9b
    schemaName: crea8_objektvertriebassistent_p3Z5Bl.skill.projekt-dossier_KSr
    dialog:
      kind: InlineAgentSkill
      skillFolderName: projekt-dossier
      content: |
        ---
        name: projekt-dossier
        description: Verfahren fuer das Gesamtbild eines Bauprojekts. Verwenden bei Formulierungen wie alles, alle Infos, was wissen wir ueber, Stand von, Uebersicht, Zusammenfassung sowie bei jeder Frage, die mehrere Aspekte eines Projekts gleichzeitig betrifft. Legt fest, dass dafuer das Tool Projekt-Dossier mit einem einzigen Aufruf genutzt wird und wie das Ergebnis statusabhaengig berichtet wird. Nicht verwenden, wenn nur ein einzelner Wert gefragt ist.
        ---
        <!-- bic:source=upload -->
        ## Ein Aufruf statt Kette
        Für das Gesamtbild wird das Tool Projekt-Dossier mit dem kürzesten markanten Adress- oder Namensteil aufgerufen (z. B. "Hertha-Sponer", "Franklinstr" — keine Hausnummern). Es liefert in einem Ergebnis: `kandidaten` (Anzahl passender Portal-Projekte), `portalKandidaten` (Titel, Status, Website), `portal` (Status, Rollen, Auftragswert, Systeme, Mengen, Termine, Website), `familie` (alle VCs mit Status und Auftraggeber), `belege` (SAP-Angebote und Auftragsbestätigungen mit Werten und Darchiv-Links) und `dokumente` (Dateien mit `Link`). Die Einzeltools werden für das Gesamtbild NICHT mehr nacheinander aufgerufen.

        Ist `kandidaten` größer als 1: die `portalKandidaten` mit Ort, Adresse und Status auflisten und nachfragen, welches Projekt gemeint ist — erst danach das Dossier berichten.

        Ist `kandidaten` 0: das Projekt ist nicht in der Abwicklung. Dann bildet die `familie` aus dem Ergebnis (CRM-Auflösung über die Adresse) den Kern des Dossiers.

        ## Statusabhängig berichten
        - **Offen / nicht gewonnen** (kandidaten 0, Familie vorhanden): Familie mit allen VCs, Beteiligte, Angebote/Belege mit Werten. Ein Satz, dass das Projekt noch nicht in der Abwicklung ist. Keine Portal- oder Dokument-Abschnitte.
        - **Ausführung / Abnahme:** Status, Rollen, Auftragswert (netto, ohne Nachträge), Systeme, Termine, Familie, Belege, Dokumente inkl. Rechnungen — alles verlinkt, keine Rechnungsbeträge aus Dokumenten.
        - **Gewährleistung / abgeschlossen:** der Endstand — Abnahme, Schlussrechnung (verlinkt), Revisionsunterlagen, Termine, Beteiligte für Rückfragen.
        - **Verloren:** die Familie mit der Deutung, über welche Stufe der Lieferkette abgeschlossen wurde oder warum verloren; letzte Belege.

        ## Form
        Berichtsreihenfolge wie im Kern: Projekt (Ort, Adresse, Name) → Status, Phase, Beteiligte → VCs, Belege, Beträge → Dokumente und Links. Jeder Projekttitel auf `Website`, jedes Dokument auf sein `Link`-Feld, jeder Beleg auf `ax_mysolarluxlink`. Bei vielen Dokumenten nach Typ gruppieren. Eine Folgefrage, die ein Dossier nur eingrenzt ("der mit dem höchsten Wert", "und dazu alles"), behält die Dossier-Absicht.

        ## Ergänzungen
        Verlangt die Frage etwas, das im Dossier-Ergebnis nicht enthalten ist (z. B. Dokumentinhalte, eine Zählung, ein Ranking), wird dafür ergänzend das passende Einzeltool aufgerufen — das Dossier ersetzt die Einzeltools nicht für Detailfragen.
