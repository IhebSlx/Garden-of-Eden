  .card .ec.sk{color:#9db0e8;border-style:dashed;}
  .card .ec .tdot{width:5px;height:5px;margin-right:0;}

  #view2d.vfar .card .ext{display:none!important;}

  #navui{position:fixed;right:16px;bottom:44px;z-index:11;display:none;flex-direction:column;gap:8px;align-items:flex-end;}

  .stbtn{all:unset;cursor:pointer;font-size:9.5px;padding:2px 9px;border-radius:99px;border:1px solid rgba(124,140,255,.25);color:#8ea2d6;display:inline-flex;align-items:center;gap:5px;}

</style>

<div id="viewToggle"><button id="btn2d">2D</button><button id="btn3d" class="on">3D</button><span class="div"></span><button id="arrange">Auto-arrange</button><span class="div"></span><button id="btnDet">Details</button></div>

<div id="view2d"><div id="board2d"><svg id="wires2d"></svg></div></div>

function buildSatellites(inst){

    const mm=new THREE.MeshBasicMaterial({color:it.hex,transparent:true,opacity:0});

function rebuildWire3d(w){
  const A=w.from.pos,B=w.to.pos;
  const mid=A.clone().add(B).multiplyScalar(.5);
  const ctrl=w.e.k==='p'
    ? new THREE.Vector3(mid.x*1.45,mid.y+20,mid.z*1.45)
    : new THREE.Vector3(mid.x*1.18,mid.y+5,mid.z*1.18);
  const curve=new THREE.QuadraticBezierCurve3(A.clone(),ctrl,B.clone());
  const geo=new THREE.TubeGeometry(curve,24,w.e.k==='p'?.3:.45,8,false);
  if(w.tube){w.tube.geometry.dispose();w.tube.geometry=geo;}
  else{
    const color=w.e.k==='p'?0x9bb8ff:KIND_COLOR[w.to.a.kind];
    w.tube=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color,transparent:true,
      opacity:w.baseOp,blending:THREE.AdditiveBlending,depthWrite:false}));
    fleet.add(w.tube);
  }
}

function layout3d(){
  const root=instById['orch'];
  root.pos.set(0,95,0);root.depth=0;root.ang=Math.PI/2;
  const q=[root];
  while(q.length){
    const P=q.shift();
    const kids=instances.filter(i=>i.parentId===P.a.id);
    kids.forEach((c,idx)=>{
      const n=kids.length;
      let ang,r;
      if(P.depth===0){ang=Math.PI/4+idx*(Math.PI*2/n);r=95;}
      else{
        const total=Math.min(n*.3,1.25);
        ang=P.ang+(n===1?0:((idx/(n-1))-.5)*total);
        r=95+85*P.depth+(idx%2)*42;
      }
      c.ang=ang;c.depth=P.depth+1;
      c.pos.set(Math.cos(ang)*r,95-70*c.depth,Math.sin(ang)*r);
      q.push(c);
    });
  }
  instances.forEach(i=>i.mesh&&i.mesh.position.copy(i.pos));
  shell.position.copy(root.pos);
  wires.forEach(rebuildWire3d);
}

let focusId=null,selectedId=null;
function visibleSet(id){
  const vis=new Set([id]);
  let grew=true;
  while(grew){grew=false;
    edges.forEach(e=>{if(e.k==='h'&&vis.has(e.s)&&!vis.has(e.t)){vis.add(e.t);grew=true;}});
  }
  return vis;
}
const cam={theta:.55,phi:1.1,radius:300,target:new THREE.Vector3(0,5,0)};
const goal={radius:300,target:new THREE.Vector3(0,5,0)};
let statusFilter=null;
function matchF(st){return !statusFilter||st===statusFilter;}
function recomputeVis(){
  const vis=focusId?visibleSet(focusId):null;
  instances.forEach(i=>{
    i.focusOK=!vis||(vis.has(i.a.id)&&(i.a.id===focusId||i.parentId===null||vis.has(i.parentId)));
    i.fadeT=(i.focusOK&&matchF(i.a.st))?1:.05;
  });
  wires.forEach(w=>{
    w.focusOK=!vis||(w.from.focusOK&&w.to.focusOK);
    w.fadeT=(w.focusOK&&matchF(w.e.st))?1:.05;
    w.opT=(vis&&w.fadeT===1)?1.7:1;
  });
  sync2d();
}
function applyFocus(id){
  const prev=focusId;
  focusId=id;
  recomputeVis();
  const fd=id?instById[id].depth:0;
  instances.forEach(i=>{i.popAt=(id&&i.fadeT===1)?performance.now()+Math.max(0,(i.depth-fd))*110:-1;});
  if(id){
    const pts=instances.filter(i=>i.focusOK).map(i=>i.pos);
    const c=pts.reduce((s,p)=>s.add(p.clone()),new THREE.Vector3()).multiplyScalar(1/pts.length);
    let r=0;pts.forEach(p=>r=Math.max(r,p.distanceTo(c)));
    goal.target.copy(c);goal.radius=Math.min(340,Math.max(120,r*2.3+70));
  }else{goal.target.set(0,5,0);goal.radius=300;}
  document.getElementById('crumbSep').hidden=!id;
  document.getElementById('crumbHere').hidden=!id;
  if(id)document.getElementById('crumbHere').textContent=byId[id].name;
  if(!id&&prev&&currentView==='2d')fit2d(true);
}

  if(focusId)applyFocus(focusId);else sync2d();
};

const el=renderer.domElement;
const mouse=new THREE.Vector2(-2,-2);
const raycaster=new THREE.Raycaster();
const pointers=new Map();
let downX=0,downY=0,moved=false,lastIdle=0,pinchDist=0;
let vTheta=0,vPhi=0;
const PHI_MIN=.08,PHI_MAX=3.06,R_MIN=35,R_MAX=850;
function pan3d(dx,dy){
  const s=cam.radius*.0016;
  const right=new THREE.Vector3().setFromMatrixColumn(camera.matrix,0);
  const up=new THREE.Vector3().setFromMatrixColumn(camera.matrix,1);
  const off=right.multiplyScalar(-dx*s).add(up.multiplyScalar(dy*s));
  cam.target.add(off);goal.target.add(off);
}
el.addEventListener('contextmenu',e=>e.preventDefault());
el.addEventListener('pointerdown',e=>{
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,button:e.button});
  if(pointers.size===1){downX=e.clientX;downY=e.clientY;moved=false;vTheta=vPhi=0;}
  if(pointers.size===2){
    const[a,b]=[...pointers.values()];
    pinchDist=Math.hypot(a.x-b.x,a.y-b.y);
  }
  el.classList.add('dragging');el.setPointerCapture(e.pointerId);
});
el.addEventListener('pointermove',e=>{
  mouse.x=(e.clientX/innerWidth)*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;
  const p=pointers.get(e.pointerId);
  if(!p)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y;
  p.x=e.clientX;p.y=e.clientY;
  if(Math.hypot(e.clientX-downX,e.clientY-downY)>6)moved=true;
  lastIdle=performance.now();
  if(pointers.size===2){
    const[a,b]=[...pointers.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y);
    if(d>0){goal.radius=Math.min(R_MAX,Math.max(R_MIN,goal.radius*pinchDist/d));pinchDist=d;}
    pan3d(dx*.5,dy*.5);
    return;
  }
  if(p.button===2||e.shiftKey){pan3d(dx,dy);return;}
  vTheta=-dx*.005;vPhi=-dy*.004;
  cam.theta+=vTheta;
  cam.phi=Math.min(PHI_MAX,Math.max(PHI_MIN,cam.phi+vPhi));
});
el.addEventListener('pointerup',e=>{
  pointers.delete(e.pointerId);
  if(pointers.size===0)el.classList.remove('dragging');
  if(pointers.size===0&&!moved&&e.button===0){
    raycaster.setFromCamera(mouse,camera);
    const hits=raycaster.intersectObjects(hoverMeshes.filter(m=>instByKey[m.userData.key].fade>.5));
    if(hits.length){const inst=instByKey[hits[0].object.userData.key];burstAt(inst);applyFocus(inst.a.id);openPanel(inst.a);}
    else if(focusId){applyFocus(null);closePanel();}
  }
});
el.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);if(!pointers.size)el.classList.remove('dragging');});
el.addEventListener('dblclick',()=>{applyFocus(null);closePanel();});
el.addEventListener('wheel',e=>{e.preventDefault();
  goal.radius=Math.min(R_MAX,Math.max(R_MIN,goal.radius*(1+Math.sign(e.deltaY)*.08)));
  lastIdle=performance.now();},{passive:false});

function build2dCard(inst){

function build2dWire(w){

function draw2dWires(){
  wires.forEach(w=>{
    if(!w.path2)return;
    const A=w.from,B=w.to;
    const ha=((A.card&&A.card.offsetHeight)||68)/2,hb=((B.card&&B.card.offsetHeight)||68)/2;
    let d;
    if(w.e.k==='p'){
      d=`M ${A.x2} ${A.y2-ha} C ${A.x2} ${A.y2-ha-70}, ${B.x2} ${B.y2-hb-70}, ${B.x2} ${B.y2-hb}`;
    }else{
      const y1=A.y2+ha,y2=B.y2-hb,dy=Math.min(110,Math.max(40,(y2-y1)*.5));
      d=`M ${A.x2} ${y1} C ${A.x2} ${y1+dy}, ${B.x2} ${y2-dy}, ${B.x2} ${y2}`;
    }
    w.path2.setAttribute('d',d);
  });
}
let boardW=1200,boardH=800;
function layout2d(){
  let slot=0;const SW=170,ROW=185,TOP=120;
  function place(inst,ki){
    const kids=instances.filter(i=>i.parentId===inst.a.id);
    let nx;
    if(!kids.length){nx=(slot++ +0.5)*SW;}
    else{
      kids.forEach((k,i2)=>{if(i2>0)slot+=inst.depth===0?0.7:0.2;place(k,i2);});
      nx=kids.reduce((s,k)=>s+k.x2,0)/kids.length;
    }
    if(!inst.drag2){
      inst.x2=nx;
      inst.y2=TOP+inst.depth*ROW+(inst.depth>=2?(ki%2)*36:0);
    }
  }
  place(instById['orch'],0);
  const maxD=Math.max(...instances.map(i=>i.depth||0));
  boardW=Math.max(slot*SW+120,1200);
  boardH=TOP+maxD*ROW+190;
  board2d.style.width=boardW+'px';
  board2d.style.height=boardH+'px';
  instances.forEach(i=>{if(i.card&&i.x2!==undefined){i.card.style.left=i.x2+'px';i.card.style.top=i.y2+'px';}});
  draw2dWires();

}
function fit2d(animate){

function frame2d(){
  const full=instances.filter(i=>i.fadeT===1);
  if(!full.length)return;
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  full.forEach(i=>{
    const w=((i.card&&i.card.offsetWidth)||150)/2+30,h=((i.card&&i.card.offsetHeight)||68)/2+30;
    minX=Math.min(minX,i.x2-w);maxX=Math.max(maxX,i.x2+w);
    minY=Math.min(minY,i.y2-h);maxY=Math.max(maxY,i.y2+h);
  });
  const s=Math.min((innerWidth-80)/(maxX-minX),(innerHeight-200)/(maxY-minY),1.25);
  v2.s=s;

  v2.y=(innerHeight-(minY+maxY)*s)/2+10;

function searchAgents(q){
  const toks=q.toLowerCase().split(/\s+/).filter(Boolean);
  if(!toks.length)return[];
  const out=[];
  agents.forEach(a=>{
    const hay={name:a.name,role:a.role||'',kind:KIND_LABEL[a.kind],status:SLBL[a.st],
      skills:a.skills.join(' '),tools:a.tools.map(t=>t.n+' '+TLBL[t.t]).join(' '),
      data:a.data.map(d=>d.n+' '+d.t+' '+DSLBL[d.st]).join(' ')};
    let score=0,field=null,ok=true;
    toks.forEach(tk=>{
      let s=0,f=null;
      const nm=hay.name.toLowerCase();
      if(nm.startsWith(tk)){s=100;f='name';}
      else if(nm.includes(tk)){s=70;f='name';}
      else{for(const[k,v]of Object.entries(hay)){
        if(k!=='name'&&v.toLowerCase().includes(tk)){s=k==='role'?40:25;f=k;break;}}}
      if(!s)ok=false;else{score+=s;if(!field||f==='name')field=f;}
    });
    if(ok)out.push({a,score,field});
  });
  return out.sort((x,y)=>y.score-x.score).slice(0,6);
}

function updateMMView(){

function mmJump(e){

  v2.x=innerWidth/2-bx*v2.s;v2.y=innerHeight/2-by*v2.s;apply2d();

view2d.addEventListener('pointerdown',e=>{

  p2.set(e.pointerId,{x:e.clientX,y:e.clientY});

  if(p2.size===2){const[a,b]=[...p2.values()];pinch2=Math.hypot(a.x-b.x,a.y-b.y);}
  view2d.setPointerCapture(e.pointerId);
});
view2d.addEventListener('pointermove',e=>{
  const p=p2.get(e.pointerId);if(!p)return;

  if(Math.hypot(e.clientX-bx,e.clientY-by)>6)bMoved=true;
  if(p2.size===2){
    const[a,b]=[...p2.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);
    if(d>0&&pinch2>0){zoom2dAt((a.x+b.x)/2,(a.y+b.y)/2,d/pinch2);pinch2=d;}

function zoom2dAt(cx,cy,k){

  draw2dWires();
};

// ---------------- animate ----------------
function animate(t){
  requestAnimationFrame(animate);
  if(pointers.size===0){
    if(vTheta){cam.theta+=vTheta;vTheta*=.92;if(Math.abs(vTheta)<1e-5)vTheta=0;}
    if(vPhi){cam.phi=Math.min(PHI_MAX,Math.max(PHI_MIN,cam.phi+vPhi));vPhi*=.92;if(Math.abs(vPhi)<1e-5)vPhi=0;}
    if(!reduceMotion&&t-lastIdle>6000)cam.theta+=.0009;
  }
  cam.radius+=(goal.radius-cam.radius)*.06;
  cam.target.lerp(goal.target,.06);
  camera.position.set(
    cam.target.x+cam.radius*Math.sin(cam.phi)*Math.sin(cam.theta),
    cam.target.y+cam.radius*Math.cos(cam.phi),
    cam.target.z+cam.radius*Math.sin(cam.phi)*Math.cos(cam.theta));
  camera.lookAt(cam.target);
  shell.rotation.y+=.003;shell.rotation.x+=.0012;

  raycaster.setFromCamera(mouse,camera);
  const hit=currentView==='3d'
    ? raycaster.intersectObjects(hoverMeshes.filter(m=>instByKey[m.userData.key].fade>.5))[0]
    : null;
  el.style.cursor=hit?'pointer':'';

  const lf=Math.min(1,Math.max(0,(480-cam.radius)/110));
  const sf=Math.min(1,Math.max(0,(400-cam.radius)/90));
  detFade+=((showDetails?1:0)-detFade)*.12;
  instances.forEach(i=>{
    i.fade+=(i.fadeT-i.fade)*.08;
    const stB=i.a.st==='planned'?.55:1;
    const gM=i.a.st==='building'?(.78+.22*Math.sin(t*.003+i.ph)):1;
    i.mesh.material.opacity=i.fade*stB;
    i.glow.material.opacity=.7*i.fade*stB*gM;
    i.label.material.opacity=i.fade*(i.depth>=2?lf:1);
    if(i.sat){
      const o=detFade*i.fade*sf;
      i.sat.mats.forEach(mm=>mm.opacity=mm.userData.base*o);
      i.sat.group.visible=o>.02;
    }
    i.mesh.visible=i.fade>.02;
    let target=(hit&&hit.object===i.mesh)?1.28:(selectedId===i.a.id?1.2:1);
    if(i.popAt>0){const dtp=t-i.popAt;if(dtp>0&&dtp<420)target*=1+Math.sin(dtp/420*Math.PI)*.14;}
    i.scl+=(target-i.scl)*.12;
    const cur=i.mesh.scale.x;
    i.mesh.scale.setScalar(cur+(i.scl-cur)*.14);
    if(i.ring){
      const on=selectedId===i.a.id&&i.fade>.5;
      i.ring.material.opacity+=((on?.85:0)-i.ring.material.opacity)*.15;
      i.ring.scale.setScalar(KIND_SIZE[i.a.kind]*(3+Math.sin(t*.004)*.14));
    }
  });
  shell.material.opacity=.22*instById['orch'].fade;
  wires.forEach(w=>{
    w.fade+=(w.fadeT-w.fade)*.08;
    w.op+=(w.opT-w.op)*.08;
    if(w.tube){const sm=w.e.st==='planned'?.35:w.e.st==='building'?.7:1;
      w.tube.material.opacity=w.baseOp*sm*w.fade*w.op;w.tube.visible=w.fade>.02;}
  });
  for(let bi=bursts.length-1;bi>=0;bi--){
    const b=bursts[bi],k=(t-b.start)/500;
    if(k>=1){fleet.remove(b.s);bursts.splice(bi,1);continue;}
    b.s.scale.setScalar(b.base*(2.4+3.4*k));
    b.s.material.opacity=.9*(1-k);
  }
  if(currentView==='3d')renderer.render(scene,camera);
}
animate(0);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
